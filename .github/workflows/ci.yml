name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Build generated site
        run: cargo run -p site-builder --release

      - name: Install worker-build
        run: cargo install worker-build --locked

      - name: Build Worker
        run: worker-build --release

      - name: Install Node and Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start local Worker
        run: |
          npx --yes wrangler@4.58.0 dev --local --port 8787 > /tmp/wrangler.log 2>&1 &
          echo $! > /tmp/wrangler.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8787/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/wrangler.log
          exit 1

      - name: Route smoke tests
        run: ./tests/route-smoke.sh

      - name: Stop local Worker
        if: always()
        run: kill "$(cat /tmp/wrangler.pid)" 2>/dev/null || true
